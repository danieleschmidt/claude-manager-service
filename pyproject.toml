[project]
name = "claude-manager-service"
version = "0.1.0"
description = "FastAPI service for managing Claude AI sessions with rate limiting and usage tracking"
requires-python = ">=3.10"
dependencies = ["fastapi", "pydantic"]

[project.scripts]
claude-manager = "claude_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
